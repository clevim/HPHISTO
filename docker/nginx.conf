server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # tipos corretos p/ PWA e JSX
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js jsx;
        application/manifest+json             webmanifest;
        image/png                             png;
        image/svg+xml                         svg;
        application/octet-stream              bin;
    }

    # SPA-ish: cai no index se não achar
    location / {
        try_files $uri $uri/ /index.html;
    }

    # service worker nunca em cache (pra atualizar a app)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # assets estáticos com cache longo
    location ~* \.(?:css|js|jsx|png|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
