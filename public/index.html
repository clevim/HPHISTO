<!DOCTYPE html>
<html lang="pt-BR" data-theme="console">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>HΦSTO — forja de preços 3D</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1a1206" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="HΦSTO" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>

  <!-- core: lógica pura JS -->
  <script src="js/core/data.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/calc.js"></script>
  <script src="js/core/extras.js"></script>
  <script src="js/core/nfc.js"></script>

  <!-- store: estado global -->
  <script type="text/babel" src="js/store/store.jsx"></script>

  <!-- ui: componentes base e visualizações -->
  <script type="text/babel" src="js/ui/ui.jsx"></script>
  <script type="text/babel" src="js/ui/buildviz.jsx"></script>

  <!-- screens: telas completas -->
  <script type="text/babel" src="js/screens/detailed.jsx"></script>
  <script type="text/babel" src="js/screens/calculator.jsx"></script>
  <script type="text/babel" src="js/screens/manage.jsx"></script>
  <script type="text/babel" src="js/app/nfc-modal.jsx"></script>
  <script type="text/babel" src="js/screens/calendar.jsx"></script>
  <script type="text/babel" src="js/screens/catalog.jsx"></script>
  <script type="text/babel" src="js/screens/clients.jsx"></script>
  <script type="text/babel" src="js/screens/compare.jsx"></script>
  <script type="text/babel" src="js/screens/dashboard.jsx"></script>
  <script type="text/babel" src="js/screens/screens.jsx"></script>

  <!-- app: shell, navegação e overlays globais -->
  <script type="text/babel" src="js/app/app.jsx"></script>
  <script type="text/babel" src="js/app/cmdk.jsx"></script>
  <script type="text/babel" src="js/ui/tweaks-panel.jsx"></script>
  <script type="text/babel" src="js/app/tweaks-app.jsx"></script>

  <script type="text/babel" data-presets="react">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StoreProvider><App /><TweaksApp /></StoreProvider>);
  </script>

  <script>
    // verifica autenticação — redireciona para Login/Cadastro se necessário
    // demo=1 não precisa de login
    if (new URLSearchParams(location.search).get('demo') !== '1') {
      fetch('/api/auth/me').then(async r => {
        if (r.status === 401) {
          const d = await r.json().catch(() => ({}));
          // hasUsers → Login; sem usuários → Cadastro (primeiro acesso)
          window.location.replace(d.hasUsers ? 'Login.html' : 'Cadastro.html');
        }
      }).catch(() => {});
    }

    // registra o service worker (PWA / offline) — só em http(s), não em file://
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#E8A33B"/>
      <g fill="#1a1206" stroke="none">
        <path d="M22 44 L37 36 L78 36 L78 47 L60 47 L55 54 L56.5 64 L69 64 L69 72 L31 72 L31 64 L43.5 64 L45 54 L26 47 Z"/>
      </g>
    </svg>
  </template>
</body>
</html>
