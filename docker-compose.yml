services:
  hfsto:
    image: ${HFSTO_IMAGE:-ghcr.io/clevim/hphisto:latest}
    container_name: hfsto
    ports:
      - "8080:8080"
    volumes:
      - hfsto_data:/data
    environment:
      - PORT=8080
      - DB_PATH=/data/hphisto.db
      - NODE_ENV=production
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - API_TOKEN=${API_TOKEN:-}      # defina no .env — gere com: openssl rand -hex 32
      - CORS_ORIGIN=${CORS_ORIGIN:-*} # ex: https://seu-dominio.com
    restart: unless-stopped

volumes:
  hfsto_data:
